name: Windows 11 browser acceptance
run-name: Windows 11 acceptance ${{ github.event.pull_request.merge_commit_sha }} ${{ github.event.label.name }}
on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: read
jobs:
  browser:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["ci:windows11","ci:windows11:stress"]'), github.event.label.name)
    # Register this label only on a Windows 11 x64 runner started in the
    # interactive user session. A Windows service is not this fixture.
    runs-on: [self-hosted, Windows, X64, windows-11-interactive]
    environment: windows-browser
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Run browser acceptance
        shell: pwsh
        env:
          FIXTURE_CHROME: ${{ vars.BROWSERDOCK_CHROME }}
          FIXTURE_DRIVER: ${{ vars.BROWSERDOCK_DRIVER }}
          FIXTURE_STRESS: ${{ github.event.label.name == 'ci:windows11:stress' }}
        run: ./scripts/test-windows.ps1 -Chrome $env:FIXTURE_CHROME -Driver $env:FIXTURE_DRIVER -Stress:($env:FIXTURE_STRESS -eq 'true') -Results .artifacts/browser-acceptance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/browser-acceptance/
            tests/BrowserDock.Tests/reference-results/
