name: Windows quarantined browser tests
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  quarantined-browser:
    if: github.event.label.name == 'ci:quarantined'
    # Separate check and concurrency group: this diagnostic run cannot replace
    # or cancel the normal browser gate. Failures remain visible; no retries.
    concurrency:
      group: quarantined-browser-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install pinned Chrome for Testing and ChromeDriver
        run: |
          $fixture = ./scripts/install-browser-fixture.ps1 -Version '154.0.8037.57' -Destination (Join-Path $env:RUNNER_TEMP 'browserdock-cft')
          "BROWSERDOCK_CHROME=$($fixture.Chrome)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BROWSERDOCK_DRIVER=$($fixture.Driver)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run quarantined Core browser tests
        run: ./scripts/test-windows.ps1 -Chrome $env:BROWSERDOCK_CHROME -Driver $env:BROWSERDOCK_DRIVER -QuarantinedOnly -FixtureKind GitHubHosted -Results .artifacts/quarantined-browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-quarantined-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/quarantined-browser/
            ${{ runner.temp }}/browserdock-cft/downloads.json
