name: Secret scan
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  secrets:
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'ci:run' || github.event.label.name == 'ci:required')
    # A skipped scan for another label must not satisfy the required Secret scan check.
    name: ${{ github.event_name == 'pull_request' && github.event.label.name != 'ci:run' && github.event.label.name != 'ci:required' && 'Not requested - Secret scan' || 'Secret scan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
