name: Korean wiki publication
on:
  push:
    branches: [docs/wiki-ko-20260923]
    paths:
      - '.github/workflows/wiki-publish.yml'
      - 'docs/wiki/**'
      - 'docs/wiki-manifest.json'
      - 'scripts/publish-wiki-ko.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browserdock-korean-wiki-publication
  cancel-in-progress: false
jobs:
  publish-wiki:
    if: github.repository == 'mete0rfish/BrowserDock' && github.ref == 'refs/heads/docs/wiki-ko-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate authored Korean pages
        run: python3 scripts/publish-wiki-ko.py --check-only
      - name: Publish Korean pages while preserving existing wiki content
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS="$RUNNER_TEMP/wiki-askpass.sh"
          trap 'rm -f "$GIT_ASKPASS"' EXIT
          cat > "$GIT_ASKPASS" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$GIT_ASKPASS"
          python3 scripts/publish-wiki-ko.py --publish
