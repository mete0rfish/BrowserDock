name: Common contracts
on: [push, pull_request, workflow_dispatch]
jobs:
  common:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore UcDotNet.slnx
      - run: dotnet build UcDotNet.slnx --no-restore -m:1
      - run: dotnet test tests/UcDotNet.Tests/UcDotNet.Tests.csproj -f ${{ matrix.framework }} --no-build --no-restore --filter "TestCategory!=Windows" --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}-${{ matrix.framework }}
          path: tests/UcDotNet.Tests/TestResults/*.trx
