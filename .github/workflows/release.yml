name: Package candidate and approved release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified candidate after release environment approval
        type: boolean
        default: false
      windows_run_id:
        description: Successful stress-enabled Windows browser run ID for this exact commit (required to publish)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: package-release
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - run: dotnet restore BrowserDock.slnx
      - run: dotnet build BrowserDock.slnx -c Release --no-restore -m:1
      - name: Common runtime contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-ItemPropertyValue 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full' -Name Release
          if ($release -lt 533320) { throw 'Framework 4.8.1 runtime required.' }
          foreach ($tfm in 'net8.0','net10.0') {
            dotnet test tests/BrowserDock.Tests -c Release -f $tfm --no-build --no-restore --filter 'TestCategory!=Windows'
            if ($LASTEXITCODE -ne 0) { throw "Core $tfm failed" }
          }
          foreach ($tfm in 'net481','net8.0','net10.0') {
            dotnet test tests/BrowserDock.FrameworkTests -c Release -f $tfm --no-build --no-restore --filter 'TestCategory!=Windows'
            if ($LASTEXITCODE -ne 0) { throw "Legacy $tfm failed" }
          }
      - run: python -m unittest discover -s tests/seleniumbase-reference -p test_compare.py -v
      - run: python -m unittest discover -s tests/tooling -v
      - run: dotnet pack src/BrowserDock -c Release --no-build --no-restore -m:1 -o .artifacts/packages
      - run: dotnet pack src/BrowserDock.Legacy -c Release --no-build --no-restore -m:1 -o .artifacts/packages
      - run: python scripts/check-packages.py .artifacts/packages
      - name: Compile and load modern package consumers
        shell: pwsh
        run: |
          dotnet restore tests/BrowserDock.PackageConsumer "-p:RestoreAdditionalProjectSources=$pwd/.artifacts/packages"
          if ($LASTEXITCODE -ne 0) { throw 'Package consumer restore failed.' }
          dotnet build tests/BrowserDock.PackageConsumer -c Release --no-restore -m:1
          if ($LASTEXITCODE -ne 0) { throw 'Package consumer build failed.' }
          foreach ($tfm in 'net8.0','net10.0') {
            dotnet run --project tests/BrowserDock.PackageConsumer -c Release -f $tfm --no-build --no-restore
            if ($LASTEXITCODE -ne 0) { throw "Package consumer $tfm failed." }
          }
      - name: Compile and load classic package consumer
        shell: pwsh
        run: |
          msbuild tests/BrowserDock.ClassicConsumer/ClassicConsumer.csproj -restore -m:1 -p:Configuration=Release "-p:RestoreAdditionalProjectSources=$pwd/.artifacts/packages"
          if ($LASTEXITCODE -ne 0) { throw 'Package consumer build failed.' }
          & ./tests/BrowserDock.ClassicConsumer/bin/Release/ClassicConsumer.exe
          if ($LASTEXITCODE -ne 2) { throw 'Package consumer load failed.' }
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ github.sha }}
          path: .artifacts/packages/*.*nupkg
          if-no-files-found: error
  publish:
    if: inputs.publish && vars.PUBLIC_RELEASE_ENABLED == 'true'
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - id: evidence
        name: Require Windows acceptance for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
        run: python scripts/check-release-run.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          run-id: ${{ inputs.windows_run_id }}
          github-token: ${{ github.token }}
          path: .artifacts/evidence
      - name: Verify actual executed tests and stress fixture
        shell: pwsh
        run: |
          $fixtures = @(Get-ChildItem .artifacts/evidence -Recurse -Filter fixture.json)
          if ($fixtures.Count -ne 1) { throw 'Expected exactly one fixture record.' }
          $fixture = Get-Content $fixtures[0].FullName -Raw | ConvertFrom-Json
          if ($fixture.Commit -ne $env:GITHUB_SHA -or $fixture.Stress -ne $true -or $fixture.WorkingTree) { throw 'Wrong commit, dirty checkout, or missing stress run.' }
          $root = $fixtures[0].DirectoryName
          foreach ($tfm in 'net8.0','net10.0') {
            ./scripts/assert-test-results.ps1 -Path "$root/$tfm.trx" -RequiredClasses 'BrowserDock.Tests.WindowsTests','BrowserDock.Tests.ReferenceTests','BrowserDock.Tests.AttachmentFailureTests'
          }
          foreach ($tfm in 'net481','net8.0','net10.0') {
            ./scripts/assert-test-results.ps1 -Path "$root/legacy-$tfm.trx" -RequiredClasses 'BrowserDock.FrameworkTests.WindowsLegacyTests'
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ github.sha }}
          path: .artifacts/packages
      - run: python scripts/check-packages.py .artifacts/packages --release
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish the same verified artifacts
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          foreach ($package in Get-ChildItem .artifacts/packages -Filter *.nupkg | Sort-Object Name) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Publishing $($package.Name) failed." }
          }
