name: Windows hosted browser tests
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      stress:
        description: Include 100 cycles and 20 concurrent browsers
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci:run'
    name: ${{ github.event_name == 'pull_request' && github.event.label.name != 'ci:run' && 'Not requested - browser' || 'browser' }}
    # Keep concurrency on the job so a skipped unrelated label cannot cancel a run.
    concurrency:
      group: hosted-browser-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install pinned Chrome for Testing and ChromeDriver
        run: |
          $fixture = ./scripts/install-browser-fixture.ps1 -Version '154.0.8037.57' -Destination (Join-Path $env:RUNNER_TEMP 'browserdock-cft')
          "BROWSERDOCK_CHROME=$($fixture.Chrome)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BROWSERDOCK_DRIVER=$($fixture.Driver)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run common and real browser tests on Windows Server
        env:
          FIXTURE_STRESS: ${{ inputs.stress || false }}
        run: |
          ./scripts/test-windows.ps1 -Chrome $env:BROWSERDOCK_CHROME -Driver $env:BROWSERDOCK_DRIVER -Stress:($env:FIXTURE_STRESS -eq 'true') -FixtureKind GitHubHosted -Results .artifacts/hosted-browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-hosted-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/hosted-browser/
            ${{ runner.temp }}/browserdock-cft/downloads.json
